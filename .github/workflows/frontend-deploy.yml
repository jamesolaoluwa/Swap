name: Frontend — Build

on:
  push:
    branches: [main]
    paths:
      - 'swap_frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'swap_frontend/**'

env:
  FLUTTER_VERSION: '3.35.5'
  API_BASE_URL: 'https://app-swapai-backend.azurewebsites.net'
  ENTRA_TENANT_NAME: 'swapauth'
  ENTRA_REDIRECT_URI: 'https://stwa-swap-dev.azurestaticapps.net/'

permissions:
  contents: read

jobs:
  # ── Build Flutter Web ────────────────────────────────────────────────────────
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swap_frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build web (release)
        run: |
          flutter build web --release \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} \
            --dart-define=ENTRA_TENANT_NAME=${{ env.ENTRA_TENANT_NAME }} \
            --dart-define=ENTRA_TENANT_ID=${{ secrets.ENTRA_TENANT_ID }} \
            --dart-define=ENTRA_CLIENT_ID=${{ secrets.ENTRA_FRONTEND_CLIENT_ID }} \
            --dart-define=ENTRA_REDIRECT_URI=${{ env.ENTRA_REDIRECT_URI }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: swap_frontend/build/web/
          retention-days: 1
